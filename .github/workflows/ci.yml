name: Validate Mac Health
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build:native
      - run: npm test
      - run: npm audit --omit=dev --prefix com.astakhoff.mac-health.sdPlugin
      - run: npm run validate
      - run: npm run pack
